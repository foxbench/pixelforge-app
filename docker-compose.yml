# web, the queue worker and the scheduler are the same image with different commands.
# They share one volume (/data) that holds the SQLite database and Laravel's storage.
# Configuration comes from .env (copy .env.example, then fill in APP_KEY and the Pixelforge values).

x-app: &app
  build: .
  image: pixelforge-app
  env_file:
    - path: .env
      required: false
  environment:
    DB_DATABASE: /data/database.sqlite
  volumes:
    - appdata:/data
  restart: unless-stopped

services:
  web:
    <<: *app
    ports:
      - "127.0.0.1:8210:80"
    environment:
      DB_DATABASE: /data/database.sqlite
      RUN_MIGRATIONS: "true"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 12

  queue:
    <<: *app
    # --tries=1 is only the default; SubmitGeneration sets its own $tries (6).
    command: php artisan queue:work --tries=1 --sleep=1 --max-time=3600
    depends_on:
      web:
        condition: service_healthy

  scheduler:
    <<: *app
    command: php artisan schedule:work
    depends_on:
      web:
        condition: service_healthy

volumes:
  appdata:
